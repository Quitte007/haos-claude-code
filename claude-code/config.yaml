name: "Claude Code CLI"
description: "Claude Code AI assistant (Pro/Max subscription) with full access to your Home Assistant configuration"
version: "1.9.0"
slug: "claude_code"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
startup: services
boot: manual

options:
  ha_url: "http://homeassistant:8123"
  claude_model: "claude-sonnet-4-6"
  terminal_cols: 220
  terminal_rows: 50
  anthropic_api_key: ""

schema:
  ha_url: str
  claude_model: str
  terminal_cols: int
  terminal_rows: int
  anthropic_api_key: "str?"

ports:
  7681/tcp: null

ingress: true
ingress_port: 7681
ingress_stream: true
ingress_entry: /
panel_icon: mdi:robot-excited
panel_title: "Claude Code"
panel_admin: false

map:
  - config:rw
  - share:rw
  - ssl:ro
  - backup:rw
  - media:rw
  - addon_config:rw
  - all_addon_configs:ro
  - addons:ro

devices:
  - /dev/sda
  - /dev/sdb
  - /dev/sdc
  - /dev/mmcblk0
  - /dev/nvme0
  - /dev/sg0
  - /dev/sg1
  - /dev/sg2
  - /dev/sg3

full_access: true

privileged:
  - SYS_ADMIN
  - SYS_RAWIO
  - SYS_RESOURCE
  - SYS_MODULE
  - NET_ADMIN
  - SYS_PTRACE

kernel_modules: true
udev: true
host_dbus: true
host_network: true
host_ipc: true

homeassistant_api: true
hassio_api: true
hassio_role: manager

environment:
  TERM: xterm-256color
  COLORTERM: truecolor

