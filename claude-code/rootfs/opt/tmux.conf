# Claude Code HA Addon — tmux config
# Deployed to /data/.tmux.conf on first run, never overwritten by updates.

# Maus komplett aktivieren (scrollen, markieren, Panel wechseln)
set -g mouse on

# Mit Maus markierter Text wird sofort in tmux-Buffer kopiert
# und gleichzeitig per OSC 52 an den Browser/ttyd geschickt
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe "cat" \; run "tmux show-buffer | base64 | xargs -I{} printf '\033]52;c;{}\a'"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "cat" \; run "tmux show-buffer | base64 | xargs -I{} printf '\033]52;c;{}\a'"

# Shift+Pfeiltasten scrollen (alternativ zu Maus-Scroll)
bind -n S-Up    copy-mode
bind -n S-Down  send-keys ""

# Vi-Keys im Copy-Modus
setw -g mode-keys vi

# Längeren Scroll-Buffer (10000 Zeilen statt default 2000)
set -g history-limit 10000

# Kein nervöses Blinken bei Escape
set -s escape-time 0

# Statusleiste unten: Session-Name + Uhrzeit
set -g status on
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour39,bold] HA:#S #[default]"
set -g status-right "#[fg=colour244] %H:%M %d.%m.%Y "
set -g status-left-length 30

# Aktives Fenster hervorheben
setw -g window-status-current-style "fg=colour39,bold"
